# spliff Release Workflow
#
# Creates signed RPM releases when a version tag is pushed.
# Builds for: Fedora 44/43/42 (dynamic), AlmaLinux 10/9 (static vectorscan)
# Publishes signed .rpm packages with detached GPG signatures to GitHub Releases
#
# Pipeline: build (4x parallel) → test → sign → publish
#
# Caching strategy (https://github.com/docker/bake-action/issues/96):
# - GitHub Actions cache is scoped per branch, not accessible across tags
# - This workflow runs on BOTH main branch AND tags
# - Main branch builds populate the cache (no release created)
# - Tag builds access the cache from main, then sign and publish
#
# Security:
# - GPG key imported via crazy-max/ghaction-import-gpg (no shell exposure)
# - All secrets passed through env: variables
# - RPM signatures verified before publishing

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VECTORSCAN_VERSION: "5.4.12"

jobs:
  # ==========================================================================
  # Check which distros already have artifacts in the release
  # ==========================================================================
  check-existing:
    name: Check Existing Artifacts
    runs-on: ubuntu-latest
    outputs:
      fedora-44: ${{ steps.check.outputs.fedora-44 }}
      fedora-43: ${{ steps.check.outputs.fedora-43 }}
      fedora-42: ${{ steps.check.outputs.fedora-42 }}
      almalinux-10: ${{ steps.check.outputs.almalinux-10 }}
      almalinux-9: ${{ steps.check.outputs.almalinux-9 }}
    steps:
      - name: Check for existing release artifacts
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On main branch: always build all distros (to populate cache)
          # On tag: check if artifacts already exist in release
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            echo "Main branch build - building all distros to populate cache"
            for distro in fedora-44 fedora-43 fedora-42 almalinux-10 almalinux-9; do
              echo "$distro=build" >> $GITHUB_OUTPUT
            done
            echo "=== Build decisions (main branch) ==="
            cat $GITHUB_OUTPUT
            exit 0
          fi

          TAG=${GITHUB_REF#refs/tags/}

          # Get list of assets in existing release (if any)
          ASSETS=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null || echo "")

          # Check each distro
          for distro in fedora-44 fedora-43 fedora-42 almalinux-10 almalinux-9; do
            if echo "$ASSETS" | grep -q "fc44" && [ "$distro" = "fedora-44" ]; then
              echo "$distro=skip" >> $GITHUB_OUTPUT
            elif echo "$ASSETS" | grep -q "fc43" && [ "$distro" = "fedora-43" ]; then
              echo "$distro=skip" >> $GITHUB_OUTPUT
            elif echo "$ASSETS" | grep -q "fc42" && [ "$distro" = "fedora-42" ]; then
              echo "$distro=skip" >> $GITHUB_OUTPUT
            elif echo "$ASSETS" | grep -q "el10" && [ "$distro" = "almalinux-10" ]; then
              echo "$distro=skip" >> $GITHUB_OUTPUT
            elif echo "$ASSETS" | grep -q "el9" && [ "$distro" = "almalinux-9" ]; then
              echo "$distro=skip" >> $GITHUB_OUTPUT
            else
              echo "$distro=build" >> $GITHUB_OUTPUT
            fi
          done

          echo "=== Build decisions (tag release) ==="
          cat $GITHUB_OUTPUT

  # ==========================================================================
  # Fedora 44 (Full feature support - kernel 7.0+ target)
  # ==========================================================================
  build-fedora-44:
    name: Build (Fedora 44)
    needs: check-existing
    if: needs.check-existing.outputs.fedora-44 == 'build'
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Setup DNF cache directory
        run: mkdir -p /var/cache/dnf /var/cache/libdnf5

      - name: Cache DNF packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/dnf
            /var/cache/libdnf5
          key: dnf-fedora-44-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            dnf-fedora-44-

      - name: Install dependencies
        run: |
          dnf clean metadata || true
          dnf install -y --setopt=keepcache=True \
            git cmake make pkg-config \
            gcc gcc-c++ clang llvm bpftool \
            libbpf-devel elfutils-libelf-devel zlib-ng-devel \
            llhttp-devel libnghttp2-devel \
            ck-devel \
            libzstd-devel brotli-devel \
            libxdp-devel userspace-rcu-devel \
            jemalloc-devel pcre2-devel \
            vectorscan-devel \
            rpm-build

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (Release)
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build-release --parallel

      - name: Create RPM package
        run: cd build-release && cpack -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spliff-fedora-44
          path: |
            build-release/spliff
            build-release/*.rpm
          retention-days: 7

  # ==========================================================================
  # Fedora 43 (Full feature support)
  # ==========================================================================
  build-fedora-43:
    name: Build (Fedora 43)
    needs: check-existing
    if: needs.check-existing.outputs.fedora-43 == 'build'
    runs-on: ubuntu-latest
    container: fedora:43

    steps:
      - name: Setup DNF cache directory
        run: mkdir -p /var/cache/dnf /var/cache/libdnf5

      - name: Cache DNF packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/dnf
            /var/cache/libdnf5
          key: dnf-fedora-43-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            dnf-fedora-43-

      - name: Install dependencies
        run: |
          dnf clean metadata || true
          dnf install -y --setopt=keepcache=True \
            git cmake make pkg-config \
            gcc gcc-c++ clang llvm bpftool \
            libbpf-devel elfutils-libelf-devel zlib-ng-devel \
            llhttp-devel libnghttp2-devel \
            ck-devel \
            libzstd-devel brotli-devel \
            libxdp-devel userspace-rcu-devel \
            jemalloc-devel pcre2-devel \
            vectorscan-devel \
            rpm-build

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (Release)
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build-release --parallel

      - name: Create RPM package
        run: cd build-release && cpack -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spliff-fedora-43
          path: |
            build-release/spliff
            build-release/*.rpm
          retention-days: 7

  # ==========================================================================
  # Fedora 42 (Full feature support)
  # ==========================================================================
  build-fedora-42:
    name: Build (Fedora 42)
    needs: check-existing
    if: needs.check-existing.outputs.fedora-42 == 'build'
    runs-on: ubuntu-latest
    container: fedora:42

    steps:
      - name: Setup DNF cache directory
        run: mkdir -p /var/cache/dnf /var/cache/libdnf5

      - name: Cache DNF packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/dnf
            /var/cache/libdnf5
          key: dnf-fedora-42-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            dnf-fedora-42-

      - name: Install dependencies
        run: |
          dnf clean metadata || true
          dnf install -y --setopt=keepcache=True \
            git cmake make pkg-config \
            gcc gcc-c++ clang llvm bpftool \
            libbpf-devel elfutils-libelf-devel zlib-ng-devel \
            llhttp-devel libnghttp2-devel \
            ck-devel \
            libzstd-devel brotli-devel \
            libxdp-devel userspace-rcu-devel \
            jemalloc-devel pcre2-devel \
            vectorscan-devel \
            rpm-build

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (Release)
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build-release --parallel

      - name: Create RPM package
        run: cd build-release && cpack -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spliff-fedora-42
          path: |
            build-release/spliff
            build-release/*.rpm
          retention-days: 7

  # ==========================================================================
  # AlmaLinux 10 (RHEL 10 Compatible - static vectorscan)
  # ==========================================================================
  build-alma10:
    name: Build (AlmaLinux 10)
    needs: check-existing
    if: needs.check-existing.outputs.almalinux-10 == 'build'
    runs-on: ubuntu-latest
    container: almalinux:10

    steps:
      - name: Setup DNF cache directory
        run: mkdir -p /var/cache/dnf

      - name: Cache DNF packages
        uses: actions/cache@v6
        with:
          path: /var/cache/dnf
          key: dnf-alma10-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            dnf-alma10-

      - name: Enable EPEL and CRB
        run: |
          dnf clean metadata
          dnf install -y --setopt=keepcache=True epel-release
          dnf config-manager --set-enabled crb || true
          dnf config-manager --set-enabled epel || true
          dnf makecache
          echo "=== Enabled repositories ==="
          dnf repolist enabled

      - name: Install dependencies
        run: |
          dnf makecache --refresh
          dnf install -y --setopt=keepcache=True --allowerasing \
            git cmake make pkg-config curl \
            gcc gcc-c++ clang llvm bpftool \
            libbpf-devel elfutils-libelf-devel zlib-ng-devel \
            llhttp-devel libnghttp2-devel \
            ck-devel libxdp-devel \
            libzstd-devel brotli-devel \
            userspace-rcu-devel pcre2-devel \
            jemalloc-devel \
            rpm-build \
            boost-devel sqlite-devel glibc-devel \
            python3-devel libpcap-devel pcre2-devel
          # Install colm, colm-devel (provides libfsm), and ragel together from EPEL 10.2
          dnf install -y \
            https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/Packages/c/colm-0.14.7-10.el10_2.x86_64.rpm \
            https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/Packages/c/colm-devel-0.14.7-10.el10_2.x86_64.rpm \
            https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/Packages/r/ragel-7.0.4-8.el10_2.x86_64.rpm

      - name: Restore vectorscan cache
        id: cache-vectorscan
        uses: actions/cache/restore@v6
        with:
          path: |
            /usr/local/include/hs
            /usr/local/lib64/libhs.a
            /usr/local/lib64/libhs_runtime.a
            /usr/local/lib64/pkgconfig/libhs.pc
          key: vectorscan-${{ env.VECTORSCAN_VERSION }}-el10-static

      - name: Build vectorscan from source (static)
        id: build-vectorscan
        run: |
          # Check if vectorscan was restored from cache
          if [ -f /usr/local/lib64/libhs.a ] && [ -f /usr/local/include/hs/hs.h ]; then
            echo "✓ vectorscan already installed (restored from cache), skipping build"
            echo "built=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Building vectorscan from source..."
          echo "built=true" >> $GITHUB_OUTPUT
          cd /tmp
          curl -sL https://github.com/VectorCamp/vectorscan/archive/refs/tags/vectorscan/${VECTORSCAN_VERSION}.tar.gz | tar xz
          cd vectorscan-vectorscan-${VECTORSCAN_VERSION}
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DFAT_RUNTIME=ON \
            -DBUILD_AVX2=ON \
            -DBUILD_AVX512=ON \
            -DBUILD_AVX512VBMI=ON \
            -DPCRE_SOURCE=pcre2
          cmake --build build -j$(nproc)
          cmake --install build

      - name: Save vectorscan cache
        if: steps.build-vectorscan.outputs.built == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /usr/local/include/hs
            /usr/local/lib64/libhs.a
            /usr/local/lib64/libhs_runtime.a
            /usr/local/lib64/pkgconfig/libhs.pc
          key: vectorscan-${{ env.VECTORSCAN_VERSION }}-el10-static

      - name: Update library cache
        run: ldconfig

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (Release, static vectorscan)
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:${PKG_CONFIG_PATH}
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SANITIZERS=OFF \
            -DENABLE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build build-release --parallel

      - name: Create RPM package
        run: cd build-release && cpack -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spliff-almalinux-10
          path: |
            build-release/spliff
            build-release/*.rpm
          retention-days: 7

  # ==========================================================================
  # AlmaLinux 9 (RHEL 9 Compatible - static vectorscan)
  # ==========================================================================
  build-alma9:
    name: Build (AlmaLinux 9)
    needs: check-existing
    if: needs.check-existing.outputs.almalinux-9 == 'build'
    runs-on: ubuntu-latest
    container: almalinux:9

    steps:
      - name: Setup DNF cache directory
        run: mkdir -p /var/cache/dnf

      - name: Cache DNF packages
        uses: actions/cache@v6
        with:
          path: /var/cache/dnf
          key: dnf-alma9-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            dnf-alma9-

      - name: Enable EPEL and CRB
        run: |
          dnf clean metadata
          dnf install -y --setopt=keepcache=True epel-release
          dnf config-manager --set-enabled crb || true
          dnf config-manager --set-enabled epel || true
          dnf makecache
          echo "=== Enabled repositories ==="
          dnf repolist enabled

      - name: Install dependencies
        run: |
          dnf makecache --refresh
          dnf install -y --setopt=keepcache=True --allowerasing \
            git cmake make pkg-config curl \
            gcc gcc-c++ clang llvm bpftool \
            libbpf-devel elfutils-libelf-devel zlib-ng-devel \
            llhttp-devel libnghttp2-devel \
            ck-devel libxdp-devel \
            libzstd-devel brotli-devel \
            userspace-rcu-devel pcre2-devel \
            jemalloc-devel \
            rpm-build \
            boost-devel ragel sqlite-devel glibc-devel \
            python3-devel libpcap-devel pcre-devel

      - name: Restore vectorscan cache
        id: cache-vectorscan
        uses: actions/cache/restore@v6
        with:
          path: |
            /usr/local/include/hs
            /usr/local/lib64/libhs.a
            /usr/local/lib64/libhs_runtime.a
            /usr/local/lib64/pkgconfig/libhs.pc
          key: vectorscan-${{ env.VECTORSCAN_VERSION }}-el9-static

      - name: Build vectorscan from source (static)
        id: build-vectorscan
        run: |
          # Check if vectorscan was restored from cache
          if [ -f /usr/local/lib64/libhs.a ] && [ -f /usr/local/include/hs/hs.h ]; then
            echo "✓ vectorscan already installed (restored from cache), skipping build"
            echo "built=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Building vectorscan from source..."
          echo "built=true" >> $GITHUB_OUTPUT
          cd /tmp
          curl -sL https://github.com/VectorCamp/vectorscan/archive/refs/tags/vectorscan/${VECTORSCAN_VERSION}.tar.gz | tar xz
          cd vectorscan-vectorscan-${VECTORSCAN_VERSION}
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DFAT_RUNTIME=ON \
            -DBUILD_AVX2=ON \
            -DBUILD_AVX512=ON \
            -DBUILD_AVX512VBMI=ON
          cmake --build build -j$(nproc)
          cmake --install build

      - name: Save vectorscan cache
        if: steps.build-vectorscan.outputs.built == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /usr/local/include/hs
            /usr/local/lib64/libhs.a
            /usr/local/lib64/libhs_runtime.a
            /usr/local/lib64/pkgconfig/libhs.pc
          key: vectorscan-${{ env.VECTORSCAN_VERSION }}-el9-static

      - name: Update library cache
        run: ldconfig

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (Release, static vectorscan)
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:${PKG_CONFIG_PATH}
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SANITIZERS=OFF \
            -DENABLE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build build-release --parallel

      - name: Create RPM package
        run: cd build-release && cpack -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spliff-almalinux-9
          path: |
            build-release/spliff
            build-release/*.rpm
          retention-days: 7

  # ==========================================================================
  # Test Artifacts (Verify RPMs and binaries before signing)
  # ==========================================================================
  test:
    name: Test Artifacts
    needs: [build-fedora-44, build-fedora-43, build-fedora-42, build-alma10, build-alma9]
    # Only run test/sign/publish on tag pushes (main branch builds only populate cache)
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      always() && (
        needs.build-fedora-44.result == 'success' ||
        needs.build-fedora-43.result == 'success' ||
        needs.build-fedora-42.result == 'success' ||
        needs.build-alma10.result == 'success' ||
        needs.build-alma9.result == 'success'
      )
    runs-on: ubuntu-latest
    container: fedora:43

    steps:
      - name: Setup DNF cache directory
        run: mkdir -p /var/cache/dnf /var/cache/libdnf5

      - name: Cache DNF packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/dnf
            /var/cache/libdnf5
          key: dnf-fedora-43-test-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            dnf-fedora-43-test-
            dnf-fedora-43-

      - name: Install test tools
        run: dnf install -y --setopt=keepcache=True --setopt=install_weak_deps=False file

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify RPM packages
        run: |
          echo "=== Verifying RPM packages ==="
          for rpm in artifacts/**/*.rpm; do
            [ -f "$rpm" ] || continue
            echo "Checking: $rpm"
            rpm -K --nosignature "$rpm" || exit 1
            rpm -qip "$rpm"
            echo ""
          done

      - name: Verify binaries
        run: |
          echo "=== Verifying binaries ==="
          for dir in artifacts/spliff-*; do
            if [ -f "$dir/spliff" ]; then
              echo "Checking: $dir/spliff"
              file "$dir/spliff"
              file "$dir/spliff" | grep -q "ELF" || exit 1
              echo ""
            fi
          done

  # ==========================================================================
  # Sign Packages (Fedora container with native rpm-sign)
  # ==========================================================================
  sign:
    name: Sign Packages
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: fedora:43

    steps:
      - name: Setup DNF cache directory
        run: mkdir -p /var/cache/dnf /var/cache/libdnf5

      - name: Cache DNF packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/dnf
            /var/cache/libdnf5
          key: dnf-fedora-43-sign-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            dnf-fedora-43-sign-
            dnf-fedora-43-

      - name: Install signing tools
        run: dnf install -y --setopt=keepcache=True --setopt=install_weak_deps=False rpm-sign gnupg2

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          VERSION=${TAG_REF#refs/tags/v}
          mkdir -p release

          # Copy binaries with distro suffix
          for dir in artifacts/spliff-*; do
            distro=$(basename "$dir" | sed 's/spliff-//')
            if [ -f "$dir/spliff" ]; then
              cp "$dir/spliff" "release/spliff-${VERSION}-${distro}"
              chmod +x "release/spliff-${VERSION}-${distro}"
            fi
          done

          # Copy all RPM packages
          find artifacts -name '*.rpm' -exec cp {} release/ \;

          echo "=== Release assets ==="
          ls -la release/

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure GPG for non-interactive signing
        env:
          GPG_KEYID: ${{ steps.import_gpg.outputs.keyid }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Method: Use gpg-preset-passphrase to cache passphrase in gpg-agent
          # This is the official GnuPG method for unattended signing
          # Reference: https://www.gnupg.org/documentation/manuals/gnupg/Invoking-gpg_002dpreset_002dpassphrase.html

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          # Configure gpg-agent to allow passphrase preset (required for gpg-preset-passphrase)
          printf '%s\n' "allow-preset-passphrase" "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf

          # Configure gpg for batch mode
          printf '%s\n' "batch" "pinentry-mode loopback" > ~/.gnupg/gpg.conf

          chmod 600 ~/.gnupg/*.conf

          # Restart gpg-agent with new config
          gpgconf --kill gpg-agent || true
          gpg-connect-agent /bye  # This starts the agent with new config

          # Get the keygrip (required for gpg-preset-passphrase)
          # Use -m1 to get first keygrip (the signing key), ignore subkey keygrip
          KEYGRIP=$(gpg --with-keygrip --list-secret-keys "$GPG_KEYID" | grep -m1 'Keygrip' | awk '{print $3}')
          if [ -z "$KEYGRIP" ]; then
            echo "ERROR: Could not determine keygrip for $GPG_KEYID"
            gpg --with-keygrip --list-secret-keys "$GPG_KEYID"
            exit 1
          fi
          echo "Keygrip: $KEYGRIP"

          # Find gpg-preset-passphrase (location varies by distro)
          GPG_PRESET=$(command -v gpg-preset-passphrase 2>/dev/null || \
                       echo "$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase")
          if [ ! -x "$GPG_PRESET" ]; then
            # Fedora/RHEL location
            GPG_PRESET="/usr/libexec/gpg-preset-passphrase"
          fi
          echo "Using: $GPG_PRESET"

          # Pre-cache the passphrase in gpg-agent (passphrase passed via stdin, not command line)
          echo "$GPG_PASSPHRASE" | "$GPG_PRESET" --preset "$KEYGRIP"
          echo "✓ Passphrase cached in gpg-agent"

          # Configure rpmmacros - minimal config, no custom __gpg_sign_cmd needed
          # The passphrase is already cached in gpg-agent
          # Note: RPM macros MUST start at column 0, so we use printf carefully
          printf '%%_signature gpg\n%%_gpg_name %s\n%%_gpg_path %s\n%%__gpg /usr/bin/gpg\n%%_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback\n' \
            "$GPG_KEYID" "$HOME/.gnupg" > ~/.rpmmacros

          # Verification: Check configuration
          echo "=== Verification: Configuration ==="
          echo "gpg-agent.conf:"
          cat ~/.gnupg/gpg-agent.conf
          echo ""
          echo "rpmmacros:"
          cat ~/.rpmmacros
          echo ""
          echo "Macro expansion test:"
          rpm --eval '%{_gpg_name}'
          rpm --eval '%{__gpg}'
          rpm --eval '%{_gpg_sign_cmd_extra_args}'

      - name: Sign RPMs
        env:
          GPG_KEYID: ${{ steps.import_gpg.outputs.keyid }}
        run: |
          # Sign RPMs using rpmsign with cached passphrase
          # No passphrase needed - gpg-agent has it cached via gpg-preset-passphrase
          for rpm in release/*.rpm; do
            [ -f "$rpm" ] || continue
            echo "Signing: $rpm"
            rpmsign --addsign "$rpm"
            echo "✓ Signed: $rpm"
          done

          # Import public key and verify all signatures
          echo "=== Signature Verification ==="
          gpg --export --armor "$GPG_KEYID" > /tmp/project_pubkey.asc
          rpm --import /tmp/project_pubkey.asc

          for rpm in release/*.rpm; do
            [ -f "$rpm" ] || continue
            echo "Verifying: $rpm"
            rpm -K "$rpm"
            rpm -K "$rpm" | grep -qi "signatures ok\|pgp\|gpg" || {
              echo "ERROR: Signature verification failed for $rpm"
              exit 1
            }
            echo "✓ Verified: $rpm"
          done

      - name: Create detached signatures for binaries
        env:
          GPG_KEYID: ${{ steps.import_gpg.outputs.keyid }}
        run: |
          # Sign binaries using gpg with cached passphrase from gpg-agent
          # No passphrase needed - already cached via gpg-preset-passphrase
          cd release
          for file in spliff-*; do
            # Only sign binaries, not RPMs (already signed) or existing signatures
            [ -f "$file" ] || continue
            [[ "$file" == *.rpm ]] && continue
            [[ "$file" == *.asc ]] && continue

            echo "Creating detached signature for $file"
            gpg --local-user "$GPG_KEYID" --detach-sign --armor --output "${file}.asc" "$file"

            # Verify the signature
            gpg --verify "${file}.asc" "$file" || {
              echo "ERROR: Signature verification failed for $file"
              exit 1
            }
            echo "✓ ${file}.asc created and verified"
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-release
          path: release/
          retention-days: 7

  # ==========================================================================
  # Publish Release to GitHub
  # ==========================================================================
  publish:
    name: Publish Release
    needs: [sign]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          VERSION=${TAG_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${TAG_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk -v ver="$VERSION" '
              /^## \[?v?'"$VERSION"'\]?/ { found=1; next }
              /^## \[?v?[0-9]/ && found { exit }
              found { print }
            ' CHANGELOG.md)

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG=$(awk -v ver="$VERSION" '
                /^## \[?'"$VERSION"'\]?/ { found=1; next }
                /^## \[?[0-9]/ && found { exit }
                found { print }
              ' CHANGELOG.md)
            fi
          fi

          if [ -z "$CHANGELOG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
            else
              CHANGELOG="Initial release"
            fi
          fi

          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "file=/tmp/changelog.txt" >> $GITHUB_OUTPUT

      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: signed-release
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: spliff ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.file }}
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
